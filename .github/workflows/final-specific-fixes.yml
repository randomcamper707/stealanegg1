name: Final requested fixes
on:
  push:
    paths:
      - '.github/workflows/final-specific-fixes.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply only requested changes
        run: python3 .github/final_specific_patch.py
      - name: Run repository tests
        run: python3 tests/test_egg_models.py
      - name: Validate diff
        run: git diff --check
      - name: Commit verified Main
        run: |
          git config user.name 'takingfromkids'
          git config user.email 'takingfromkids@gmail.com'
          git add Main.lua
          git rm -f .github/final_specific_patch.py .github/workflows/final-specific-fixes.yml
          git commit -m 'Fix Star hotbar icons and Items panel size'
          git push
