name: Inspect Star renderer context
on:
  push:
    paths:
      - '.github/workflows/inspect-star-current2.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show Star renderer context
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('Main.lua').read_text().splitlines()
          for i,line in enumerate(lines):
              if 'startOverlay' in line:
                  a=max(0,i-20); b=min(len(lines),i+130)
                  for n in range(a,b): print(f'{n+1:05}: {lines[n]}')
                  break
          PY