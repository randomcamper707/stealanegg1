name: Patch UI size and item icons
on:
  push:
    paths:
      - '.github/workflows/patch-ui-icons.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply requested UI and icon changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Main.lua')
          s=p.read_text()
          assert s.count("winScale.Scale=.5")==1
          s=s.replace("winScale.Scale=.5","winScale.Scale=.575",1)
          old="for _,root in ipairs({RS,workspace})do"
          assert s.count(old)==1
          s=s.replace(old,"for _,root in ipairs({RS,workspace,PG,game:GetService('StarterGui'),game:GetService('StarterPack'),game:GetService('Lighting')})do",1)
          p.write_text(s)
          assert "winScale.Scale=.575" in s
          assert "game:GetService('StarterGui'),game:GetService('StarterPack'),game:GetService('Lighting')" in s
          PY
          git diff --check
      - name: Commit
        run: |
          git config user.name 'takingfromkids'
          git config user.email 'takingfromkids@gmail.com'
          git add Main.lua
          git rm -f .github/workflows/patch-ui-icons.yml
          git commit -m 'Increase Items panel and improve spawned item icons'
          git push
