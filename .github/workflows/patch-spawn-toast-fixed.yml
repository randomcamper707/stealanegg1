name: Patch spawn toast fixed
on:
  push:
    paths:
      - '.github/workflows/patch-spawn-toast-fixed.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Main.lua
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip
          p=Path('Main.lua')
          s=p.read_text()
          start=s.index('local spawnToastSerial=0')
          end=s.index('local function spawnTool',start)
          payload=''
          new=gzip.decompress(base64.b64decode(payload)).decode()
          p.write_text(s[:start]+new+s[end:])
          PY
      - name: Verify
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('Main.lua').read_text()
          assert s.count("sub.Text='ADDED TO YOUR INVENTORY!'")==1
          assert s.count("item.Font=Enum.Font.FredokaOne")==1
          assert "frame.Size=UDim2.fromOffset(396,64)" in s
          print('verified')
          PY
      - name: Commit
        run: |
          git config user.name 'takingfromkids'
          git config user.email 'takingfromkids@gmail.com'
          git add Main.lua
          git rm -f .github/workflows/patch-spawn-toast-fixed.yml .github/workflows/patch-spawn-toast.yml .github/workflows/inspect-toast.yml || true
          git commit -m 'Redesign spawn notification to match game UI'
          git push
