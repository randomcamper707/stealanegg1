name: Consolidate Main V2

on:
  push:
    paths:
      - '.github/workflows/consolidate-main-v2.yml'

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Main.lua
        run: python bundle_main.py
      - name: Commit bundled Main.lua
        run: |
          git config user.name 'takingfromkids'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Consolidate all active Lua into Main.lua and fix startup'
          git push origin main
