name: Reliable held Star renderer patch

on:
  push:
    paths:
      - 'patch_star_final3.py'
      - '.github/workflows/patch-star-final3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Main.lua
        run: python3 patch_star_final3.py
      - name: Verify patch markers
        run: |
          grep -q "DRAWING_SUPPORTED" Main.lua
          grep -q "three notification rows higher" Main.lua
      - name: Commit Main.lua and clean temporary patch files
        run: |
          git config user.name "takingfromkids"
          git config user.email "takingfromkids@gmail.com"
          git add Main.lua
          git rm patch_star_final3.py .github/workflows/patch-star-final3.yml
          git commit -m "Fix held Star visibility and raise spawn notice"
          git push
