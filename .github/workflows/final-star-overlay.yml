name: Final Star overlay patch
on:
  push:
    paths:
      - 'patch_star_overlay.py'
      - '.github/workflows/final-star-overlay.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Main.lua
        run: python3 patch_star_overlay.py
      - name: Commit Main.lua and remove patch files
        run: |
          git config user.name "takingfromkids"
          git config user.email "takingfromkids@gmail.com"
          git rm patch_star_overlay.py .github/workflows/final-star-overlay.yml
          git add Main.lua
          git commit -m "Make Star reliably visible in equipped hand"
          git push
