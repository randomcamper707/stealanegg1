name: Inspect current Star renderer
on:
  push:
    paths:
      - '.github/workflows/inspect-star-current.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show Star renderer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('Main.lua').read_text()
          a=s.index('local function startOverlay')
          b=s.index('local busy={}', a)
          print(s[a:b])
          PY