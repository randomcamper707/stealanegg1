name: Final requested toast panel Star fixes
on:
  push:
    paths:
      - '.github/workflows/final-three-amendments.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only requested items
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Main.lua')
          s=p.read_text()

          # 1) Keep the redesigned inventory toast visible exactly two seconds longer.
          old="task.delay(2.45,function()"
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,"task.delay(4.45,function()",1)

          # 2) Make the Items panel visually half size while preserving its internal layout.
          old="win.Size=UDim2.fromOffset(410,350)win.Position=UDim2.new(.5,-205,.5,-175)"
          assert s.count(old)==1, s.count(old)
          new="win.AnchorPoint=Vector2.new(.5,.5)win.Size=UDim2.fromOffset(410,350)win.Position=UDim2.fromScale(.5,.5)"
          s=s.replace(old,new,1)
          old2="win.Parent=gui corner(win,13)stroke(win,.1)"
          assert s.count(old2)==1, s.count(old2)
          new2="win.Parent=gui corner(win,13)stroke(win,.1)local winScale=Instance.new('UIScale')winScale.Scale=.5 winScale.Parent=win"
          s=s.replace(old2,new2,1)

          # 3) Star: if executor-local custom image support is unavailable, render the Star tool's
          # Roblox TextureId through a normal ImageLabel instead of leaving an invisible held tool.
          old3="""    local gui,img,drawing
    if CUSTOM_ASSET then
        gui=Instance.new('ScreenGui')"""
          assert s.count(old3)==1, s.count(old3)
          new3="""    local gui,img,drawing
    local imageSource=CUSTOM_ASSET
    if (not imageSource or imageSource=='') and tool.TextureId and tool.TextureId~='' then
        imageSource=tool.TextureId
    end
    if imageSource then
        gui=Instance.new('ScreenGui')"""
          s=s.replace(old3,new3,1)

          old4="        img.Image=CUSTOM_ASSET"
          assert s.count(old4)==1, s.count(old4)
          s=s.replace(old4,"        img.Image=imageSource",1)

          old5="""    if not NATIVE_TEMPLATE and not CUSTOM_ASSET and not DRAWING_SUPPORTED then
        warn('[SAE] Exact Star renderer unavailable; keeping existing Star tool instead of making it invisible.')
        return
    end"""
          assert s.count(old5)==1, s.count(old5)
          new5="""    local hasToolImage=tool.TextureId and tool.TextureId~=''
    if not NATIVE_TEMPLATE and not CUSTOM_ASSET and not DRAWING_SUPPORTED and not hasToolImage then
        warn('[SAE] Star renderer unavailable; keeping existing Star tool instead of making it invisible.')
        return
    end"""
          s=s.replace(old5,new5,1)

          p.write_text(s)
          PY
      - name: Verify requested changes only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('Main.lua').read_text()
          assert "task.delay(4.45,function()" in s
          assert "winScale.Scale=.5" in s
          assert "win.Position=UDim2.fromScale(.5,.5)" in s
          assert "local imageSource=CUSTOM_ASSET" in s
          assert "img.Image=imageSource" in s
          assert "local hasToolImage=tool.TextureId and tool.TextureId~=''" in s
          print('Verified: +2s toast, 50% Items panel, visible Star TextureId fallback.')
          PY
      - name: Commit clean Main.lua
        run: |
          git config user.name 'takingfromkids'
          git config user.email 'takingfromkids@gmail.com'
          git add Main.lua
          git rm -f .github/workflows/final-three-amendments.yml .github/workflows/inspect-star-current.yml .github/workflows/inspect-star-current2.yml || true
          git commit -m 'Extend toast halve Items panel and fix Star visibility'
          git push