name: Fix Main syntax 4293
on:
  push:
    paths:
      - '.github/workflows/fix-main-syntax-4293.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix ambiguous IIFE boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Main.lua')
          s=p.read_text()
          old="end)()\n\n-- Integrated from FinalExactIcons.lua"
          new="end)();\n\n-- Integrated from FinalExactIcons.lua"
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Syntax check
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
          luac5.1 -p Main.lua
      - name: Commit
        run: |
          git config user.name 'github-actions-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Main.lua
          git rm -f .github/workflows/fix-main-syntax-4293.yml
          git commit -m 'Fix Main.lua syntax and restore startup'
          git push
