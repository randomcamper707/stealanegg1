name: Force supplied Star reference
on:
  push:
    paths:
      - '.github/workflows/final-force-reference-star.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch Main.lua
        shell: python
        run: |
          from pathlib import Path
          p=Path('Main.lua')
          s=p.read_text()
          old="local NATIVE_TEMPLATE=findNativeStar()\nif NATIVE_TEMPLATE then NATIVE_TEMPLATE.Parent=nil end"
          new="-- The supplied Star reference is authoritative. Never substitute another in-game Star.\nlocal NATIVE_TEMPLATE=nil"
          if old not in s:
              raise SystemExit('native Star marker not found')
          s=s.replace(old,new,1)
          old_geom="local top=cam:WorldToViewportPoint(gripWorld+hrp.CFrame.UpVector*3.65)\n    local h=math.clamp(math.abs(top.Y-p.Y),150,310)\n    local w=h*(112/95)"
          new_geom="local top=cam:WorldToViewportPoint(gripWorld+hrp.CFrame.UpVector*2.55)\n    local h=math.clamp(math.abs(top.Y-p.Y),135,230)\n    local w=h*(112/95)"
          if old_geom in s:
              s=s.replace(old_geom,new_geom,1)
          s=s.replace("frame.Position=UDim2.new(.5,0,1,-32)","frame.Position=UDim2.new(.5,0,1,-164)",1)
          p.write_text(s)
      - name: Verify
        shell: bash
        run: |
          grep -q "local NATIVE_TEMPLATE=nil" Main.lua
      - name: Commit Main.lua and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/final-force-reference-star.yml
          git config user.name 'takingfromkids'
          git config user.email 'takingfromkids@gmail.com'
          git add Main.lua .github/workflows/final-force-reference-star.yml
          git commit -m 'Force exact supplied Star reference in hand'
          git push origin main
