name: Run Final Patch

on:
  push:
    paths:
      - '.github/workflows/run-final-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Main.lua
        run: python3 patch_final.py
      - name: Commit final Main.lua
        run: |
          git config user.name "takingfromkids"
          git config user.email "actions@users.noreply.github.com"
          git add Main.lua
          git rm -f patch_final.py star_patch.b64 .github/workflows/run-final-patch.yml .github/workflows/final-script-fixes.yml
          git commit -m "Finalize Star pet walking notifications and UI"
          git push
