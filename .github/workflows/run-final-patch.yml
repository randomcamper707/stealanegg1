name: Run verified final patch
on:
  push:
    paths:
      - '.github/workflows/run-final-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 patch_final_three.py
      - run: |
          git config user.name 'takingfromkids'
          git config user.email 'takingfromkids@gmail.com'
          git add Main.lua
          git rm -f patch_final_three.py .github/workflows/run-final-patch.yml .github/workflows/final-three-amendments.yml .github/workflows/inspect-star-current.yml .github/workflows/inspect-star-current2.yml || true
          git commit -m 'Extend toast halve Items panel and fix Star visibility'
          git push