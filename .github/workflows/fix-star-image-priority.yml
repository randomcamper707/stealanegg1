name: Prefer Roblox Star image source
on:
  push:
    paths:
      - '.github/workflows/fix-star-image-priority.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prefer normal Roblox image source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Main.lua')
          s=p.read_text()
          old="local imageSource=CUSTOM_ASSET"
          assert s.count(old)==1
          new="local imageSource=(tool.TextureId and tool.TextureId~='') and tool.TextureId or CUSTOM_ASSET"
          s=s.replace(old,new,1)
          p.write_text(s)
          assert new in s
          PY
          git diff --check
      - name: Commit
        run: |
          git config user.name 'takingfromkids'
          git config user.email 'takingfromkids@gmail.com'
          git add Main.lua
          git rm -f .github/workflows/fix-star-image-priority.yml
          git commit -m 'Prefer Roblox Star icon for held visual'
          git push
