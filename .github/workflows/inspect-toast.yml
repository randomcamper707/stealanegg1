name: Inspect spawn toast
on:
  push:
    paths:
      - '.github/workflows/inspect-toast.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show notification block
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Main.lua')
          lines=p.read_text().splitlines()
          for i,line in enumerate(lines):
              if "has been added to your inventory." in line:
                  a=max(0,i-45); b=min(len(lines),i+35)
                  print(f'FOUND AT LINE {i+1}')
                  for n in range(a,b):
                      print(f'{n+1:05}: {lines[n]}')
          PY
