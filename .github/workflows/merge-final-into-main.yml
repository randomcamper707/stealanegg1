name: Merge Final Fixes Into Main

on:
  push:
    paths:
      - 'patch_merge_final_into_main.py'
      - '.github/workflows/merge-final-into-main.yml'

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Merge final fixes into Main.lua
        run: python3 patch_merge_final_into_main.py
      - name: Verify requested integration only
        run: |
          git diff --check
          grep -F "SAE_INTEGRATED_FINAL_FIXES_20261024" Main.lua
          grep -F "d.Scale=.66125" Main.lua
          grep -F "tool.Parent==player.Character" Main.lua
          grep -F "['Unicorn Egg']='unicorn_egg'" Main.lua
          grep -F "['Star']='star'" Main.lua
      - name: Commit Main.lua and clean temporary patch files
        run: |
          rm -f patch_merge_final_into_main.py .github/workflows/merge-final-into-main.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Merge final item icons, Star fix and panel size into Main.lua"
          git push
