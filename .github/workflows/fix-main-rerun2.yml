name: Fix Main rerun startup 2
on:
  push:
    paths:
      - .github/workflows/fix-main-rerun2.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch startup guard
        shell: bash
        run: python3 -c "from pathlib import Path; p=Path('Main.lua'); s=p.read_text(); old=\"if env.SAE_SINGLE_MAIN_RUNNING then\\n    warn('[SAE] Main.lua is already running in this session.')\\n    return\\nend\"; new=\"if env.SAE_SINGLE_MAIN_RUNNING then\\n    env.SAE_SINGLE_MAIN_RUNNING=nil\\nend\"; assert old in s; p.write_text(s.replace(old,new,1))"
      - name: Commit
        shell: bash
        run: git config user.name github-actions-bot && git config user.email 41898282+github-actions[bot]@users.noreply.github.com && git add Main.lua && git rm -f .github/workflows/fix-main-rerun.yml .github/workflows/fix-main-rerun2.yml && git commit -m 'Fix Main.lua startup refresh' && git push
