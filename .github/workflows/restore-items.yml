name: Restore Item Panel

on:
  push:
    paths:
      - '.github/workflows/restore-items.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore item catalog dependency
        run: python3 patch_restore_items.py
      - name: Commit restored Main.lua and clean patch files
        run: |
          rm -f patch_restore_items.py .github/workflows/restore-items.yml
          git config user.name "takingfromkids"
          git config user.email "takingfromkids@gmail.com"
          git add -A
          git commit -m "Restore Items panel while keeping Gift Panel removed"
          git push
